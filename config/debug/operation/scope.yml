operation:
  scope_observation:
    name: observation
    type: mcp
    connector: ${connector.self}
    tools: [grafana_*]
  scope_analysis:
    name: analysis
    type: mcp
    connector: ${connector.self}
    tools: [postgres_*, mongodb_*, users_tables, file_reader, file_writer, python_executor]
  scope_coding:
    name: coding
    type: mcp
    connector: ${connector.self}
    tools: [file_reader, file_writer, python_executor]
  scope_security:
    name: security
    type: mcp
    connector: ${connector.self}
    tools: [grafana_*, users_tables]
  scope_kitchen:
    name: kitchen
    type: mcp
    connector: ${connector.self}
    tools:
      - python_executor
      - mongodb_find
      - mongodb_aggregate
      - mongodb_collection_schema
      - mongodb_collection_indexes
      - mongodb_list_collections
      - postgres_list_schemas
      - postgres_list_objects
      - postgres_get_object_details
      - postgres_execute_sql
  scope_travel:
    name: travel
    type: mcp
    connector: ${connector.self}
    tools: [python_executor]
