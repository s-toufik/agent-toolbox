connector:
  self:
    name: toolbox
    type: mcp
    base_url: ${oc.env:TOOLBOX_URL}
    timeout: 30
    transport: streamable_http
    auth:
      type: none
  external_mcp_grafana:
    name: external_mcp_grafana
    type: mcp
    base_url: ${oc.env:GRAFANA_MCP_URL,''}
    timeout: 60
    transport: streamable_http
    auth:
      type: none
    refresh:
      interval: ${oc.env:MCP_REFRESH_INTERVAL,60}
      retry_delay: ${oc.env:MCP_RETRY_DELAY,5}
      max_retry_delay: ${oc.env:MCP_MAX_RETRY_DELAY,60}
  external_mcp_mongodb:
    name: external_mcp_mongodb
    type: mcp
    base_url: ${oc.env:MONGODB_MCP_URL,''}
    timeout: 60
    transport: streamable_http
    auth:
      type: none
    refresh:
      interval: ${oc.env:MCP_REFRESH_INTERVAL,60}
      retry_delay: ${oc.env:MCP_RETRY_DELAY,5}
      max_retry_delay: ${oc.env:MCP_MAX_RETRY_DELAY,60}
  external_mcp_postgres:
    name: external_mcp_postgres
    type: mcp
    base_url: ${oc.env:POSTGRES_MCP_URL,''}
    timeout: 60
    transport: sse
    auth:
      type: none
    refresh:
      interval: ${oc.env:MCP_REFRESH_INTERVAL,60}
      retry_delay: ${oc.env:MCP_RETRY_DELAY,5}
      max_retry_delay: ${oc.env:MCP_MAX_RETRY_DELAY,60}
