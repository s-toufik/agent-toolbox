replicas: 1

ports:
  - name: http
    port: 8001
    hostPort: 8001

env:
  APP_ENV: deploy
  LOG_LEVEL: INFO
  DEPLOYMENT_ENVIRONMENT: homelab
  OTEL_HOST: otel-collector
  OTEL_PORT: "4317"
  TOOLBOX_URL: http://agent-toolbox:8001/mcp
  TOOLBOX_EXTRA_ALLOWED_HOSTS: "{{ .Values.global.domain }}:8001,{{ .Values.global.hostIP }}:8001"
  USER_DB_HOST: /data/sqlite
  USER_DB_NAME: user
  SANDBOX_TOOL_ACCESS: "true"
  WORKING_DIRECTORY: /data/working_directory

probes:
  startup:
    httpGet:
      path: /actuator/health
      port: http
      httpHeaders: [{ name: Host, value: "agent-toolbox:8001" }]
    periodSeconds: 5
    failureThreshold: 36
  readiness:
    httpGet:
      path: /actuator/health/readiness
      port: http
      httpHeaders: [{ name: Host, value: "agent-toolbox:8001" }]
    periodSeconds: 10
  liveness:
    httpGet:
      path: /actuator/health/liveness
      port: http
      httpHeaders: [{ name: Host, value: "agent-toolbox:8001" }]
    periodSeconds: 20
    failureThreshold: 6

resources:
  requests: { cpu: 100m, memory: 256Mi }
  limits: { cpu: "1", memory: 512Mi }

persistence:
  sqlite:
    mountPath: /data/sqlite
    size: 1Gi
  workdir:
    mountPath: /data/working_directory
    size: 5Gi

podAnnotations:
  homelab.io/logs: otlp

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
